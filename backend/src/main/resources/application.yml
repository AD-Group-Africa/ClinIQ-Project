spring:
  application:
    name: cliniq-backend
  datasource:
    url:      ${DATABASE_URL:jdbc:postgresql://localhost:5434/cliniq}
    username: ${DATABASE_USER:cliniq}
    password: ${DATABASE_PASSWORD:cliniq_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: ClinIQ-Pool
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout:  5000ms
  cache:
    type: redis

jwt:
  secret:                ${JWT_SECRET:development-secret-must-be-overridden-with-env-var}
  expiration-ms:         900000
  refresh-expiration-ms: 604800000

africa-talking:
  api-key:  ${AT_API_KEY:}
  username: ${AT_USERNAME:sandbox}

mpesa:
  consumer-key:    ${MPESA_CONSUMER_KEY:}
  consumer-secret: ${MPESA_CONSUMER_SECRET:}
  shortcode:       ${MPESA_SHORTCODE:174379}
  passkey:         ${MPESA_PASSKEY:}
  callback-url:    ${MPESA_CALLBACK_URL:http://localhost:8080/api/v1/billing/mpesa/callback}
  callback-secret: ${MPESA_CALLBACK_SECRET:}
  sandbox:         ${MPESA_SANDBOX:true}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth-rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    login:
      max-attempts: ${AUTH_LOGIN_RATE_LIMIT:5}
      window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:300}
    register:
      max-attempts: ${AUTH_REGISTER_RATE_LIMIT:3}
      window-seconds: ${AUTH_REGISTER_WINDOW_SECONDS:3600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    info:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cliniq: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
