spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cliniq
    username: cliniq
    password: cliniq_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
    password: redis_dev_password
  data:
    redis:
      repositories:
        enabled: false

mpesa:
  consumer-key: ""
  consumer-secret: ""
  shortcode: 174379
  passkey: ""
  callback-url: "http://localhost:8080/api/v1/billing/mpesa/callback"
  sandbox: true

africastalking:
  api-key: ""
  username: sandbox

jwt:
  secret: cliniq_jwt_secret_64chars_minimum_change_in_production_now
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

server:
  port: 8080
