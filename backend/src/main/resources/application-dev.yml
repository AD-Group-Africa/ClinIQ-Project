spring:
  datasource:
    url:      ${DATABASE_URL:jdbc:postgresql://localhost:5434/cliniq}
    username: ${DATABASE_USER:cliniq}
    password: ${DATABASE_PASSWORD:cliniq_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}
      repositories:
        enabled: false

mpesa:
  consumer-key: ""
  consumer-secret: ""
  shortcode: 174379
  passkey: ""
  callback-url: "http://localhost:8080/api/v1/billing/mpesa/callback"
  sandbox: true

africa-talking:
  api-key: ""
  username: sandbox

jwt:
  secret: ${JWT_SECRET:cliniq_jwt_secret_64chars_minimum_change_in_production_now}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

app:
  auth-rate-limit:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8080
