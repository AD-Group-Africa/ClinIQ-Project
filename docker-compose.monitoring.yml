# =============================================================
# devops/docker-compose.monitoring.yml
# ClinIQ — Observability Stack
# Run alongside main compose:
#   docker-compose -f docker-compose.yml -f devops/docker-compose.monitoring.yml up -d
# Provides:
#   Prometheus  :9090  — metrics scraping + alerting
#   Grafana     :3001  — dashboards (admin/cliniq_grafana)
#   Loki        :3100  — log aggregation
#   Promtail           — Docker log shipper → Loki
#   AlertManager:9093  — alert routing (email / Slack)
#   Node Exporter:9100 — host system metrics
# =============================================================

version: '3.9'

services:

  # ──────────────────────────────────────────
  # Prometheus — metrics collection
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cliniq_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - cliniq_net
      - monitoring_net

  # ──────────────────────────────────────────
  # AlertManager — alert routing
  # ──────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cliniq_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./devops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring_net

  # ──────────────────────────────────────────
  # Grafana — dashboards
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: cliniq_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cliniq_grafana}
      GF_SERVER_ROOT_URL:         https://${DOMAIN:-localhost}/grafana
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_USERS_ALLOW_SIGN_UP:    false
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_SMTP_ENABLED:           ${SMTP_ENABLED:-false}
      GF_SMTP_HOST:              ${SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER:              ${SMTP_USER:-}
      GF_SMTP_PASSWORD:          ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS:      ${SMTP_USER:-alerts@cliniq.app}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

  # ──────────────────────────────────────────
  # Loki — log aggregation
  # ──────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: cliniq_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./devops/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - monitoring_net

  # ──────────────────────────────────────────
  # Promtail — ships Docker logs → Loki
  # ──────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: cliniq_promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./devops/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - monitoring_net
      - cliniq_net

  # ──────────────────────────────────────────
  # Node Exporter — host system metrics
  # ──────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: cliniq_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring_net

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  monitoring_net:
    driver: bridge
  cliniq_net:
    external: true


