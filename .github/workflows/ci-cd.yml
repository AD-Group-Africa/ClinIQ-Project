# =============================================================
# .github/workflows/ci-cd.yml
# ClinIQ — CI/CD Pipeline
# Triggers:
#   PR        → test only
#   push main → test + build
# =============================================================
name: ClinIQ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:      ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cliniq-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cliniq-frontend

jobs:

  # ──────────────────────────────────────────
  # JOB 1 — Backend tests
  # ──────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       cliniq_test
          POSTGRES_USER:     cliniq
          POSTGRES_PASSWORD: test_password_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          DATABASE_URL:      jdbc:postgresql://localhost:5432/cliniq_test
          DATABASE_USER:     cliniq
          DATABASE_PASSWORD: test_password_ci
          REDIS_HOST:        localhost
          REDIS_PORT:        6379
          REDIS_PASSWORD:    ""
          JWT_SECRET:        test_jwt_secret_minimum_64_characters_long_for_testing_ci_only
          AT_API_KEY:        ""
          AT_USERNAME:       sandbox
          SPRING_PROFILES_ACTIVE: test
          SPRING_FLYWAY_ENABLED:  true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

  # ──────────────────────────────────────────
  # JOB 2 — Frontend build + lint
  # ──────────────────────────────────────────
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────
  # JOB 3 — Build & push Docker images
  # Runs on: push to main only
  # ──────────────────────────────────────────
  build-push:
    name: Build & push images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ──────────────────────────────────────────
  # JOB 4 — Security scanning
  # ──────────────────────────────────────────
  security-scan:
    name: Security scan
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run dependency scan
        run: ./gradlew --no-daemon dependencyCheckReport

  # ──────────────────────────────────────────
  # JOB 5 — Lint
  # ──────────────────────────────────────────
  lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run detekt (static analysis)
        working-directory: backend
        run: ./gradlew detekt --no-daemon

