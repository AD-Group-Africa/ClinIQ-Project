# =============================================================
# .github/workflows/ci-cd.yml
# ClinIQ — Complete CI/CD Pipeline
# Triggers:
#   PR        → test only
#   push main → test + build + deploy staging
#   push v*   → test + build + deploy production
# =============================================================
name: ClinIQ CI/CD

on:
  push:
    branches: [main, develop]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY:      ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cliniq-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cliniq-frontend
  CHATBOT_IMAGE:  ghcr.io/${{ github.repository_owner }}/cliniq-chatbot

jobs:

  # ──────────────────────────────────────────
  # JOB 1 — Backend tests
  # ──────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       cliniq_test
          POSTGRES_USER:     cliniq
          POSTGRES_PASSWORD: test_password_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          DATABASE_URL:      jdbc:postgresql://localhost:5432/cliniq_test
          DATABASE_USER:     cliniq
          DATABASE_PASSWORD: test_password_ci
          REDIS_HOST:        localhost
          REDIS_PORT:        6379
          REDIS_PASSWORD:    ""
          JWT_SECRET:        test_jwt_secret_minimum_64_characters_long_for_testing_ci_only
          AT_API_KEY:        ""
          AT_USERNAME:       sandbox
          SPRING_PROFILES_ACTIVE: test
          SPRING_FLYWAY_ENABLED:  true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

  # ──────────────────────────────────────────
  # JOB 2 — Frontend build + lint
  # ──────────────────────────────────────────
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.cliniq.app

  # ──────────────────────────────────────────
  # JOB 3 — Build & push Docker images
  # Runs on: push to main OR tag push
  # ──────────────────────────────────────────
  build-push:
    name: Build & push images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.cliniq.app

      - name: Build & push chatbot
        uses: docker/build-push-action@v5
        with:
          context: ./chatbot
          push: true
          tags: |
            ${{ env.CHATBOT_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.CHATBOT_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ──────────────────────────────────────────
  # JOB 4 — Deploy to staging
  # Runs on: push to main branch only
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy → staging
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: deploy
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/cliniq

            echo "Pulling latest images..."
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest
            docker pull ${{ env.CHATBOT_IMAGE }}:latest

            echo "Rolling update..."
            docker-compose up -d --no-build --remove-orphans

            echo "Waiting for health check..."
            for i in {1..24}; do
              STATUS=$(curl -sf http://localhost:8080/actuator/health \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
              [ "$STATUS" = "UP" ] && echo "✅ Backend healthy" && break
              echo "Attempt $i/24 — waiting..."
              sleep 10
            done

            docker image prune -f
            echo "✅ Staging deployment complete"

      - name: Post deployment smoke test
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://staging.cliniq.app/actuator/health)
          [ "$STATUS" = "200" ] && echo "✅ Smoke test passed" || \
            (echo "❌ Smoke test failed (HTTP $STATUS)" && exit 1)

  # ──────────────────────────────────────────
  # JOB 5 — Deploy to production
  # Runs on: version tag (v1.2.3)
  # Requires manual approval via GitHub environment
  # ──────────────────────────────────────────
  deploy-production:
    name: Deploy → production
    needs: build-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production   # requires approval in GitHub settings

    steps:
      - name: Tag images with version
        run: |
          VERSION=${{ needs.build-push.outputs.version }}
          echo "Deploying version: $VERSION"

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: deploy
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/cliniq
            VERSION="${{ needs.build-push.outputs.version }}"

            echo "🚀 Deploying ClinIQ $VERSION to production..."

            # Backup database before deploy
            /usr/local/bin/cliniq-backup.sh

            # Pull versioned images
            docker pull ${{ env.BACKEND_IMAGE }}:$VERSION
            docker pull ${{ env.FRONTEND_IMAGE }}:$VERSION
            docker pull ${{ env.CHATBOT_IMAGE }}:$VERSION

            # Update .env with new version
            sed -i "s/^VERSION=.*/VERSION=$VERSION/" .env

            # Rolling restart with health checks
            docker-compose up -d --no-build --remove-orphans

            # Health check loop
            for i in {1..30}; do
              STATUS=$(curl -sf http://localhost:8080/actuator/health \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
              [ "$STATUS" = "UP" ] && echo "✅ Production backend healthy" && break
              echo "Attempt $i/30..."
              sleep 10
            done

            docker image prune -f
            echo "✅ Production deployment complete: $VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClinIQ ${{ github.ref_name }}
          body: |
            ## ClinIQ ${{ github.ref_name }}

            Production deployment completed successfully.

            ### Deployment details
            - Backend: `${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}`
            - Frontend: `${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}`
            - Chatbot: `${{ env.CHATBOT_IMAGE }}:${{ github.ref_name }}`
          generate_release_notes: true

# =============================================================
# REQUIRED GITHUB SECRETS:
#
# Repository secrets:
#   STAGING_HOST      — IP/hostname of staging server
#   STAGING_SSH_KEY   — Private SSH key for 'deploy' user on staging
#   PROD_HOST         — IP/hostname of production server
#   PROD_SSH_KEY      — Private SSH key for 'deploy' user on production
#
# GitHub Environments:
#   staging    — no required reviewers
#   production — require 1 reviewer approval before deploy
#
# SETUP COMMANDS (run on each server):
#   sudo useradd -m -s /bin/bash deploy
#   sudo usermod -aG docker deploy
#   sudo mkdir -p /home/deploy/.ssh
#   sudo echo "YOUR_PUBLIC_KEY" > /home/deploy/.ssh/authorized_keys
#   sudo chown -R deploy:deploy /home/deploy/.ssh
#   sudo chmod 700 /home/deploy/.ssh
#   sudo chmod 600 /home/deploy/.ssh/authorized_keys
# =============================================================
